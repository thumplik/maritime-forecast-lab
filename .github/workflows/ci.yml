name: CI

# Smoke CI (build plan §2): lint, unit tests, typecheck, build and API-contract drift.
# No proprietary data or model weights: tests that need local data are marked golden and
# never run here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.3"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Sync environment (locked)
        working-directory: backend
        run: uv sync --locked
      - name: Ruff
        working-directory: backend
        run: uv run ruff check src tests ../scripts && uv run ruff format --check src tests ../scripts
      - name: Unit tests (no network, no local data)
        working-directory: backend
        run: uv run pytest -q
      - name: OpenAPI schema is up to date
        run: |
          uv run --project backend python scripts/export_openapi.py
          git diff --exit-code -- frontend/lib/api/openapi.json || {
            echo "::error::frontend/lib/api/openapi.json is stale. Run 'make gen-api' and commit."; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: frontend/lib/api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- lib/api/schema.d.ts || {
            echo "::error::frontend/lib/api/schema.d.ts is stale. Run 'make gen-api' and commit."; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
