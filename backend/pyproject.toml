[project]
name = "maritime-forecast"
version = "0.0.1"
description = "Maritime Forecast Lab: leakage-aware AIS vessel trajectory forecasting workbench"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.10",
    "pyarrow>=17",
    "numpy>=1.26",
    "pyproj>=3.6",
    "geographiclib>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tqdm>=4.66",
    "pytz>=2026.5",
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "shapely>=2.0",
    "pyshp>=2.3",
    "h3>=4,<5",
]

[project.optional-dependencies]
# Milestone 6: Timestral zero-shot adapter. Optional and lazy (build plan §2, §5 T1): never
# installed by CI or `make setup`; `uv sync --extra timestral` adds it. Pinned to the release
# commit (research/adapters/timestral/README.md); weights are pinned separately by revision.
timestral = [
    "timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "jupytext>=1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the timestral extra is pinned to a git commit

[tool.hatch.build.targets.wheel]
packages = ["src/maritime_forecast"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "../scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # inline synthetic data tables read better unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "golden: requires local NOAA data; run via `make calibrate`, never in CI",
    "network: requires network access; never run in ordinary unit tests",
    "timestral: needs the optional timestral extra and weights; run with -m timestral",
]
addopts = "-m 'not golden and not network and not timestral'"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
