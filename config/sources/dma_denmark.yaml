# Danish Maritime Authority historical AIS CSV (http://aisdata.ais.dk/), the Danish corpus
# used by TrAISformer and the calibration paper.
# VERIFIED 2026-10-20 against aisdk-2023-06-01.csv (member of 2023/aisdk-2023-06.zip,
# SHA-256 b41f6ab4...243897, 11,809,593 rows). Header, timestamp and ETA formats, and every
# value of Type of mobile / Ship type / Navigational status seen that day are handled.
# Findings: docs/data-contracts.md "DMA verification".
# 2023 is published as monthly zips only; later years as daily zips.
source_id: dma_denmark
version: 2  # v2: drop non-vessel stations, map ETA, complete ship-type labels
description: Danish Maritime Authority terrestrial AIS, daily CSV.
file_format: csv
columns:
  vessel_id: MMSI
  observed_at: "# Timestamp"          # e.g. 01/06/2023 00:00:00, UTC
  latitude_deg: Latitude
  longitude_deg: Longitude
  sog: SOG
  cog_deg: COG
  heading_deg: Heading
  nav_status: Navigational status     # text, e.g. "Under way using engine"
  vessel_type: Ship type              # text, e.g. "Cargo"
  length_m: Length
  width_m: Width
  draft_m: Draught
  transceiver_class: Type of mobile   # "Class A" / "Class B" / "Base Station" ...
  destination: Destination
  eta: ETA                            # same dd/mm/YYYY format as the timestamp
timestamp:
  timezone: UTC
  format: "%d/%m/%Y %H:%M:%S"
sog_unit: knots
null_values:
  nav_status: ["Unknown value"]
  vessel_type: ["Undefined"]
# Not vessels: shore base stations, aids to navigation, SAR aircraft and distress beacons.
drop_values:
  transceiver_class: ["Base Station", "AtoN", "SAR Airborne",
                      "Search and Rescue Transponder", "Emergency PIRB"]
value_maps:
  transceiver_class: {"Class A": "A", "Class B": "B"}
vessel_class_from: text_map
vessel_class_text_map:
  Cargo: cargo
  Tanker: tanker
  Fishing: fishing
  Passenger: passenger
  Tug: tug_tow
  Towing: tug_tow
  Towing long/wide: tug_tow
  Pleasure: pleasure_sail
  Sailing: pleasure_sail
  HSC: hsc_wig
  WIG: hsc_wig
  Pilot: service
  SAR: service
  Port tender: service
  Anti-pollution: service
  Law enforcement: service
  Medical: service
  Dredging: service
  Diving: service
  Military: other
  Other: other
  Reserved: other
  Spare 1: other
  Spare 2: other
  Not party to conflict: other
static_fields_provenance: broadcast
verified: true
